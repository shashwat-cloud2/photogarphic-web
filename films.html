<style>
  .video-section { background: var(--cream-2); color: var(--ink); padding: 8rem 2rem; position: relative; }
  .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2.5rem; max-width: 1200px; margin: 0 auto; }
  .video-card { cursor: pointer; background: #ffffff; border-radius: 4px; overflow: hidden; position: relative; border: 1px solid var(--sand); transition: transform 0.6s cubic-bezier(.2,.7,.2,1), box-shadow 0.6s ease, border-color 0.6s ease; }
  .video-card:hover { transform: translateY(-8px); border-color: rgba(73,92,79,0.6); box-shadow: 0 20px 40px rgba(26,31,27,0.15), 0 0 30px rgba(73,92,79,0.12); }
  .video-card__thumb { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; }
  .video-card__img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(0.2) brightness(0.95); transition: transform 1.2s cubic-bezier(.2,.7,.2,1), filter 0.8s ease; }
  .video-card:hover .video-card__img { transform: scale(1.08); filter: grayscale(0) brightness(1.05); }
  .video-card__play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(20,24,21,0.25); transition: background 0.4s ease; }
  .video-card:hover .video-card__play { background: rgba(20,24,21,0.1); }
  .video-card__play svg { width: 60px; height: 60px; color: var(--cream); filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6)); transition: transform 0.4s cubic-bezier(.2,.7,.2,1), color 0.4s ease; }
  .video-card:hover .video-card__play svg { transform: scale(1.15); color: var(--green); }
  .video-card__info { padding: 1.5rem; background: #ffffff; position: relative; z-index: 2; border-top: 1px solid var(--sand); }
  .video-card__info h3 { font-family: var(--display); font-size: 1.3rem; font-weight: 500; color: var(--ink); margin-bottom: 0.4rem; line-height: 1.3; }
  .video-card__info p { font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--green); }
  .lightbox__video-container { width: 90vw; max-width: 1200px; aspect-ratio: 16 / 9; position: relative; animation: fadeInScale 0.6s cubic-bezier(.2,.7,.2,1) both; }
  .lightbox__video-container iframe { width: 100%; height: 100%; border: none; border-radius: 4px; box-shadow: 0 30px 80px rgba(0,0,0,0.8); }
</style>

<div class="lightbox" id="lightbox">
  <button class="lightbox__close" id="lightboxClose" aria-label="Close">×</button>
  <div class="lightbox__video-container" id="lightboxVideoContainer"></div>
  <img id="lightboxImg" src="" alt="" style="display:none;" />
</div>

<script src="script.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const videoGrid = document.getElementById('videoGrid');
  const videoPool = [
    { id: '5qap5aO4i9A', title: 'A Love Letter to Udaipur', tag: 'Wedding Film · 2024' },
    { id: 'jfKfPfyJRdk', title: 'The Long Way Home', tag: 'Wedding Film · 2024' },
    { id: '4xDzrJKXOOY', title: 'Monsoon Vows', tag: 'Wedding Film · 2023' },
    { id: '21X5lGlDOfg', title: 'The Silk Route', tag: 'Wedding Film · 2023' },
    { id: 'V-_O7nl0Ii0', title: 'Under the Stars', tag: 'Wedding Film · 2023' },
    { id: 'k85mRPqvMbE', title: 'A Quiet Morning', tag: 'Editorial Film · 2022' },
    { id: 'lTRiuFIWV54', title: 'Bridal Portraits', tag: 'Behind the Scenes' },
    { id: 'MVPTGNGiI-4', title: 'The First Look', tag: 'Wedding Film · 2022' },
    { id: 'F4neLJQC1_E', title: 'Golden Hour', tag: 'Couple Session' }
  ];

  const shuffled = videoPool.sort(() => 0.5 - Math.random()).slice(0, 6);

  shuffled.forEach((video, index) => {
    const card = document.createElement('div');
    card.className = 'video-card';
    card.dataset.anim = 'fade-up';
    card.style.transitionDelay = (index * 0.1) + 's';
    const thumbUrl = `https://img.youtube.com/vi/${video.id}/maxresdefault.jpg`;

    card.innerHTML = `
      <div class="video-card__thumb">
        <img src="${thumbUrl}" alt="${video.title}" class="video-card__img" loading="lazy" />
        <div class="video-card__play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>
      </div>
      <div class="video-card__info"><h3>${video.title}</h3><p>${video.tag}</p></div>
    `;

    card.addEventListener('click', () => openVideoLightbox(video.id));
    videoGrid.appendChild(card);
  });

  document.querySelectorAll('.video-card').forEach(el => window.revealObserver.observe(el));
});

function openVideoLightbox(videoId) {
  const lightbox = document.getElementById('lightbox');
  const container = document.getElementById('lightboxVideoContainer');
  const closeBtn = document.getElementById('lightboxClose');
  const img = document.getElementById('lightboxImg');

  img.style.display = 'none';
  container.style.display = 'block';
  container.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;

  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';

  const closeVideo = () => {
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
    container.innerHTML = '';
    closeBtn.removeEventListener('click', closeVideo);
    lightbox.removeEventListener('click', outsideClick);
    document.removeEventListener('keydown', escClose);
  };
  const outsideClick = (e) => { if (e.target === lightbox) closeVideo(); };
  const escClose = (e) => { if (e.key === 'Escape') closeVideo(); };

  closeBtn.addEventListener('click', closeVideo);
  lightbox.addEventListener('click', outsideClick);
  document.addEventListener('keydown', escClose);
}
</script>
