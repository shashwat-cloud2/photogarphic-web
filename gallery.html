<script src="script.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const galleryGrid = document.getElementById('galleryGrid');

  const clientGalleries = {
    'udaipur': {
      name: 'Sanya & Kabir',
      location: 'Udaipur · March 2024',
      cover: 'https://blogcdn.paperlust.co/blog/wp-content/uploads/2026/08/tof-fix-21069-p0-1785774027.jpg',
      images: [
        'https://blogcdn.paperlust.co/blog/wp-content/uploads/2026/08/tof-fix-21069-p0-1785774027.jpg',
        'https://img.magnific.com/premium-photo/wedding-ceremony-newlyweds-country-cottage-green-hill_419896-17432.jpg?semt=ais_hybrid&w=740&q=80',
        'https://img.magnific.com/free-photo/young-wedding-couple-their-wedding_1303-28336.jpg?semt=ais_hybrid&w=740&q=80',
        'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSaXvqz2KJpFMF3M_eUaxPN-b4HMy55-ocKHJwUbOhkwN85Q9ZEzbjKoMU&s=10',
        'https://mixingimages.in/wp-content/uploads/2025/05/Marriage-Wedding-Couple-Poses-11.jpg',
        'https://p.potaufeu.asahi.com/72fa-p/picture/31452094/a72a3eefdcdcc1cd26597e82e25e2072.jpg'
      ]
    },
    'jodhpur': {
      name: 'Meera & Rohan',
      location: 'Jodhpur · December 2023',
      cover: 'https://static.toiimg.com/thumb/msid-124191337,imgsize-103164,width-400,resizemode-4/prajakta-koli-with-huband-vrishank-khanal.jpg',
      images: [
        'https://static.toiimg.com/thumb/msid-124191337,imgsize-103164,width-400,resizemode-4/prajakta-koli-with-huband-vrishank-khanal.jpg',
        'https://assets.vogue.in/photos/69a1aad07858d87cceea9c5a/1:1/w_3648,h_3648,c_limit/IMG_4918.JPG.jpeg',
        'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRk39itHvB-R6SkKogVAF9qC3HyRl1O2nuhlojnlfwykAg2cq_lQIFxu20&s=10',
        'https://weddingsaga.fotozoneindia.com/wp-content/uploads/2024/11/Priyadharshini-Sathish1.webp',
        'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRrR0uOqIp2nWz1oxDu-yj3eraevcFLwJ40r1rnEX5IDOdlvZzuLuHPlZw&s=10',
        'https://mixingimages.in/wp-content/uploads/2025/05/Marriage-Wedding-Couple-Poses-4.jpg'
      ]
    },
    'jaipur': {
      name: 'Ananya & Dev',
      location: 'Jaipur · October 2023',
      cover: 'https://images.unsplash.com/photo-1583939003579-730e3918a45a?w=1920&q=80',
      images: [
        'https://img.magnific.com/free-photo/portrait-happy-married-couple-handsome-groom-stylish-gray-suit-hugging-bride-wedding-dress-with-bouquet-while-posing-garden-wedding-day-ceremony_8353-11963.jpg?semt=ais_hybrid&w=740&q=80',
        'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQYUN9Y0vxufuhQtuE5z4R247_JVeB40TxZaZiWXtJN8w&s=10',
        'https://media.istockphoto.com/id/2199990828/photo/couple-in-traditional-clothing-standing-at-wedding-ceremony.jpg?s=612x612&w=0&k=20&c=4s1Q29JZ0Hyp0eFMIW66b2YL-SAnsB5fOTRyauPqSas=',
        'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSsDBQpn_hB0qMM0PFbMFdFxZJIkljr1TNrdSX2KCMkTsC-Lv8eONrW0hY&s=10',
        'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQoraiF8CFQgZ_f0sowAXN3OcRutodQr9XcX0nYbx8UFK36qMdOD75CCtCQ&s=10',
        'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQSqj0gPBqPnSusURrhmobwqUh-4rprCJOMAB4jNdaIkavSr_15dVLbyRI&s=10'
      ]
    }
  };

  const urlParams = new URLSearchParams(window.location.search);
  const client = urlParams.get('client');
  let imagesToShow = [];

  if (client && clientGalleries[client]) {
    const data = clientGalleries[client];
    const nameParts = data.name.split(' & ');
    document.getElementById('heroTitle').innerHTML = `${nameParts[0]} & <em>${nameParts[1]}</em>`;
    document.getElementById('heroSub').innerText = data.location;
    document.getElementById('heroBg').style.backgroundImage = `url('${data.cover}')`;
    document.getElementById('heroEyebrow').innerText = "Client Gallery";
    document.getElementById('galleryLabel').innerText = "The Wedding Gallery";
    imagesToShow = data.images;
  } else {
    document.getElementById('heroTitle').innerHTML = "All <em>Stories.</em>";
    document.getElementById('heroSub').innerText = "A curated collection of moments.";
    document.getElementById('heroBg').style.backgroundImage = `url('https://images.unsplash.com/photo-1519741497674-611481863552?w=1920&q=80')`;
    document.getElementById('galleryLabel').innerText = "The Collection";
    imagesToShow = [
      'https://images.unsplash.com/photo-1583939003579-730e3918a45a?w=1200&q=80',
      'https://images.unsplash.com/photo-1522673607200-164d1b6ce486?w=1200&q=80',
      'https://images.unsplash.com/photo-1511285560929-80b456fea0bc?w=1200&q=80',
      'https://images.unsplash.com/photo-1519225421980-715cb0215aed?w=1200&q=80',
      'https://images.unsplash.com/photo-1606216794074-735e91aa2c92?w=1200&q=80',
      'https://images.unsplash.com/photo-1519741497674-611481863552?w=1200&q=80'
    ];
  }

  imagesToShow.forEach((img, i) => {
    const div = document.createElement('div');
    div.className = 'gallery-grid__item';
    div.dataset.anim = 'fade-up';
    div.style.transitionDelay = (i % 3) * 0.1 + 's';

    div.innerHTML = `
      <div class="gallery-grid__bg" style="background-image:url('${img}')"></div>
      <span class="gallery-grid__caption">Click to View</span>
    `;

    div.addEventListener('click', () => window.openLightbox(img));
    galleryGrid.appendChild(div);
  });

  document.querySelectorAll('.gallery-grid__item').forEach(el => window.revealObserver.observe(el));
});
</script>
</body>
